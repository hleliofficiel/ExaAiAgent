<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" role="img" aria-labelledby="title-core_maintainer">
  <title id="title-core_maintainer">Core Maintainer - ExaAiAgent Contributor Badge</title>
  <defs>
    <radialGradient id="ringGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </radialGradient>
    <radialGradient id="plateGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="55%" stop-color="#1E2126"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="iconGrad" cx="40%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </radialGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2D33"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="30%" stop-color="#2A2D33"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
  </defs>

  <!-- laurel wreaths -->
  <g><path d="M 48 345 Q 30 220 78 118" fill="none" stroke="#6B7280" stroke-width="6" stroke-linecap="round"/><ellipse cx="52.0" cy="330.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-40.0 52.0 330.0)"/><ellipse cx="65.9" cy="288.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-47.0 65.9 288.0)"/><ellipse cx="75.5" cy="246.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-54.0 75.5 246.0)"/><ellipse cx="77.8" cy="204.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-61.0 77.8 204.0)"/><ellipse cx="72.0" cy="162.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-68.0 72.0 162.0)"/><ellipse cx="60.0" cy="120.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-75.0 60.0 120.0)"/></g>
  <g transform="translate(512,0) scale(-1,1)"><path d="M 48 345 Q 30 220 78 118" fill="none" stroke="#6B7280" stroke-width="6" stroke-linecap="round"/><ellipse cx="52.0" cy="330.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-40.0 52.0 330.0)"/><ellipse cx="65.9" cy="288.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-47.0 65.9 288.0)"/><ellipse cx="75.5" cy="246.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-54.0 75.5 246.0)"/><ellipse cx="77.8" cy="204.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-61.0 77.8 204.0)"/><ellipse cx="72.0" cy="162.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-68.0 72.0 162.0)"/><ellipse cx="60.0" cy="120.0" rx="13" ry="30" fill="url(#leafGrad)" stroke="#6B7280" stroke-width="1.5" transform="rotate(-75.0 60.0 120.0)"/></g>

  <!-- medal ring + plate -->
  <circle cx="256" cy="225" r="168" fill="url(#ringGrad)" stroke="#6B7280" stroke-width="6"/>
  <circle cx="256" cy="225" r="142" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"/>
  <circle cx="256" cy="225" r="122" fill="url(#plateGrad)" stroke="#6B7280" stroke-width="5"/>
  <ellipse cx="256" cy="167" rx="98" ry="34" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- top medal star -->
  <polygon points="256.0,12.0 264.2,34.7 288.3,35.5 269.3,50.3 276.0,73.5 256.0,60.0 236.0,73.5 242.7,50.3 223.7,35.5 247.8,34.7" fill="url(#starGrad)" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>

  <!-- icon -->
  <g stroke="url(#iconGrad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none"><path d="M256 138 L352 178 L352 252 C352 312 312 340 256 356 C200 340 160 312 160 252 L160 178 Z" fill="url(#iconGrad)" fill-opacity="0.25"/><path d="M216 246 L248 278 L304 210"/></g>

  <!-- ribbon -->
  <g>
    <path d="M28 452 L96 428 L96 520 L28 500 L52 474 Z" fill="url(#edgeGrad)" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>
    <path d="M484 452 L416 428 L416 520 L484 500 L460 474 Z" fill="url(#edgeGrad)" stroke="#6B7280" stroke-width="3" stroke-linejoin="round"/>
    <path d="M64 430 Q256 396 448 430 L448 502 Q256 468 64 502 Z" fill="url(#ribbonGrad)" stroke="url(#edgeGrad)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="102.0,453.0 105.5,461.1 114.4,462.0 107.7,467.9 109.6,476.5 102.0,472.0 94.4,476.5 96.3,467.9 89.6,462.0 98.5,461.1" fill="url(#starGrad)"/>
    <polygon points="410.0,453.0 413.5,461.1 422.4,462.0 415.7,467.9 417.6,476.5 410.0,472.0 402.4,476.5 404.3,467.9 397.6,462.0 406.5,461.1" fill="url(#starGrad)"/>
    <text x="256" y="478" text-anchor="middle" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-weight="900" font-size="26" letter-spacing="0.5" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.55" stroke-width="0.8" textLength="292" lengthAdjust="spacingAndGlyphs">CORE MAINTAINER</text>
  </g>

  <!-- bottom star -->
  <polygon points="256.0,522.0 266.6,551.4 297.8,552.4 273.1,571.6 281.9,601.6 256.0,584.0 230.1,601.6 238.9,571.6 214.2,552.4 245.4,551.4" fill="url(#starGrad)" stroke="#6B7280" stroke-width="4" stroke-linejoin="round"/>
</svg>
