name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  LINT_PATHS: >-
    exaaiagnt/grounding exaaiagnt/knowledge exaaiagnt/safety exaaiagnt/planning exaaiagnt/validation exaaiagnt/reporting exaaiagnt/version.py exaaiagnt/runtime/tool_server.py exaaiagnt/agents/ExaaiAgent/exaai_agent.py
    tests/agents/test_agent_status_contract.py
    tests/agents/test_exaai_agent_config.py
    tests/interface/test_prompt_resolution.py
    tests/llm/test_multi_tool_parsing.py
    tests/runtime/test_tool_server_import.py
    tests/runtime/test_tool_server_registry.py
  TYPECHECK_PATHS: >-
    exaaiagnt/runtime/tool_server.py

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with=dev

      - name: Ruff format check
        run: poetry run ruff format --check $LINT_PATHS

      - name: Ruff lint
        run: poetry run ruff check $LINT_PATHS

      - name: Bandit
        run: poetry run bandit -r exaaiagnt/agents/ExaaiAgent exaaiagnt/runtime/tool_server.py -c pyproject.toml

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with=dev

      - name: MyPy
        run: poetry run mypy $TYPECHECK_PATHS


  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with=dev

      - name: Unit tests
        run: poetry run pytest -v -o addopts=''

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry poetry-plugin-export pip-audit

      - name: Install dependencies
        run: poetry install --with=dev

      - name: Export lock to requirements.txt
        run: poetry export -f requirements.txt --with=main --without-hashes -o /tmp/reqs.txt

      - name: pip-audit
        run: pip-audit -r /tmp/reqs.txt --progress-spinner off

      - name: Bandit (medium+ severity)
        run: poetry run bandit -r exaaiagnt -c pyproject.toml -ll

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with=dev

      - name: CLI version smoke test
        run: poetry run exaai --version

      - name: CLI parser smoke test
        run: poetry run python -c "from exaaiagnt.interface.main import parse_arguments; import sys; sys.argv=['exaai','--target','https://example.com','--prompt-modules','graphql_security,waf_bypass']; args=parse_arguments(); assert args.target == ['https://example.com']; assert args.prompt_modules == 'graphql_security,waf_bypass'"
