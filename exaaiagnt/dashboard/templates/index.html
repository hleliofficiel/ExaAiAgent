<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExaAi Mission Control</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%233b82f6'/></svg>">
    <link rel="stylesheet" href="/static/dashboard-v2.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="16" cy="16" r="4.5" fill="currentColor"/>
        </svg>
        <div class="brand-text">
            <span class="brand-name">EXAAI<span class="brand-sub"> MISSION CONTROL</span></span>
            <span class="run-name" id="run-name">no active run</span>
        </div>
    </div>
    <div class="topbar-right">
        <div class="metric-block">
            <span class="metric-label">UPTIME</span>
            <span class="metric-value" id="uptime">--:--:--</span>
        </div>
        <div class="metric-block">
            <span class="metric-label">CONNECTION</span>
            <span class="conn"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">connecting</span></span>
        </div>
    </div>
</header>

<section class="tiles" aria-label="Summary counters">
    <div class="tile tile-confirmed">
        <span class="tile-label">Confirmed</span>
        <span class="tile-value" id="tile-confirmed">0</span>
    </div>
    <div class="tile tile-suspected">
        <span class="tile-label">Suspected</span>
        <span class="tile-value" id="tile-suspected">0</span>
    </div>
    <div class="tile tile-tools">
        <span class="tile-label">Tool calls</span>
        <span class="tile-value" id="tile-tools">0</span>
    </div>
    <div class="tile tile-agents">
        <span class="tile-label">Active agents</span>
        <span class="tile-value" id="tile-agents">0</span>
    </div>
</section>

<main class="grid">
    <section class="panel panel-events" aria-label="Live event feed">
        <div class="panel-header">
            <h2>Live Events</h2>
            <span class="panel-hint">auto-scrolling</span>
        </div>
        <div class="event-feed" id="event-feed" role="log" aria-live="polite"></div>
    </section>

    <section class="panel panel-findings" aria-label="Findings">
        <div class="panel-header">
            <h2>Findings</h2>
            <div class="panel-controls">
                <label class="sr-only" for="severity-filter">Filter by severity</label>
                <select id="severity-filter">
                    <option value="all">All severities</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                    <option value="info">Info</option>
                </select>
                <div class="export-group" aria-label="Export report">
                    <a class="btn" href="/api/export/json">JSON</a>
                    <a class="btn" href="/api/export/sarif">SARIF</a>
                    <a class="btn" href="/api/export/csv">CSV</a>
                    <a class="btn" href="/api/export/html">HTML</a>
                    <a class="btn" href="/api/export/md">MD</a>
                </div>
            </div>
        </div>
        <div class="table-wrap">
            <table class="findings-table">
                <thead>
                    <tr><th>Severity</th><th>Title</th><th>Evidence</th><th>Tool</th></tr>
                </thead>
                <tbody id="findings-body">
                    <tr class="empty-row"><td colspan="4">No findings yet</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <aside class="panel panel-surface" aria-label="Attack surface">
        <div class="panel-header">
            <h2>Attack Surface</h2>
            <span class="panel-hint" id="surface-mode">grouped by tool</span>
        </div>
        <div class="surface-body" id="surface-body">
            <p class="empty-note">No data yet</p>
        </div>
    </aside>
</main>

<script src="/static/dashboard-v2.js"></script>
</body>
</html>
